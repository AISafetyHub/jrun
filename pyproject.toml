[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jrun"
version = "0.1.0"
description = "Job submission and management CLI for airsctl"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.scripts]
jrun = "jrun.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/jrun"]
