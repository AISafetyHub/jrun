[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jrun"
version = "0.1.0"
description = "Job submission and management CLI for airsctl"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/AISafetyHub/jrun"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
jrun = "jrun.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/jrun"]
