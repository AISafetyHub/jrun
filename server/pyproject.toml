[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jrun-server"
version = "0.1.0"
description = "Remote-submission service for jrun (submits jobs with a service account)"
requires-python = ">=3.10"
# The service drives the `jrun` CLI as a subprocess and does not import it:
# install jrun separately (the Dockerfile installs it from GitHub).
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
jrun-server = "jrun_server.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["jrun_server"]
