description: Grid search test - evaluate models on multiple datasets

search:
  name: test_eval

  # (optional) Override the experiment to submit to.
  # If omitted, uses the default from `jrun init`.
  # experiment_id: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
  # experiment_name: my_other_experiment

  job_template:
    name: test_eval_{model}_{data}_{auto:4s}
    commands:
      - echo "Evaluating model={model} on dataset={data}"
    envs:
      {
        HOME: /home/yijingwei,
        MODEL_NAME: "{model}",
      }
    resource_config:
      queue_name: baai-safety_research_yybu-private
      priority: high
      accelerator_model: NVIDIA_A100-SXM4-40GB
      accelerator_count: 0
      cpu_cores: 8
      mem_gib: 128
      shared_mem_gib: 64

  sampling: grid
  max_trials: 20
  parallel_trials: 4

  params:
    - name: model
      values: ["llama3_8b", "gpt35"]
    - name: data
      values: ["news", "paper", "poem"]
