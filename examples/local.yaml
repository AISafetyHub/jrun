description: Local job test - simple echo task

job:
  name: test_local_echo

  # (optional) Submit to an existing experiment by ID/name.
  # If omitted, uses the experiment: block above or the default from
  # `.jrun/settings.json`.
  # experiment_id: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
  # experiment_name: my_other_experiment

  command: echo "Hello from jrun local job test"
  resource_config:
    queue_name: local
    priority: high
    accelerator_model: NVIDIA-A100-SXM4-40GB
    accelerator_count: 1
    cpu_cores: 8
    mem_gib: 128
    shared_mem_gib: 64
