description: Local job test - simple echo task

# Local jobs (queue_name: local) run on this machine and never touch the
# platform; the experiment block is only needed once queue_name points at a
# real queue. jrun exits with the command's exit code.
experiment:
  name: jrun_example

job:
  name: test_local_echo

  command: echo "Hello from jrun local job test"
  resource_config:
    queue_category: dedicated
    queue_name: local
    priority: high
    accelerator_model: NVIDIA-A100-SXM4-40GB
    accelerator_count: 1
    cpu_cores: 8
    mem_gib: 128
    shared_mem_gib: 64
