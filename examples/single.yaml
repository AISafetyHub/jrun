description: Single job test - simple echo task

# Experiment to submit into: jrun looks it up by name and creates it via the
# platform API if missing (using the job's image/queue for the placeholder
# config). Requires credentials (`jrun login`, or /etc/accesskey on platform
# pods). See `jrun queues` for queue options.
experiment:
  name: jrun_example_single


job:
  name: test_single_echo

  # Docker image the job runs with.
  image: harbor.baai.ac.cn/llm-safety-center/enviroments:agents-v1.0.0
  # image_region: PRIVATE   # PUBLIC (default) or PRIVATE

  # (optional) Submit to an existing experiment by ID/name.
  # If omitted, uses the experiment: block above or the default from
  # `.jrun/settings.json`.
  # experiment_id: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
  # experiment_name: my_other_experiment

  commands:
    - echo "Hello from jrun single job test"
  envs:
    {
      HOME: /home/yijingwei,
    }
  resource_config:
    queue_name: baai-safety_research_yybu-private
    priority: high
    accelerator_model: NVIDIA_A100-SXM4-40GB
    accelerator_count: 0
    cpu_cores: 8
    mem_gib: 128
    shared_mem_gib: 64