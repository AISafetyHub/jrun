description: Multi-node job test - 1 master + 2 workers with env vars

# Experiment to submit into: jrun looks it up by name and creates it via the
# platform API if missing (using the job's image/queue for the placeholder
# config). Requires credentials (`jrun login`, or /etc/accesskey on platform
# pods). See `jrun queues` for queue options.
experiment:
  name: jrun_example

job:
  name: test_multinode

  # Docker image the job runs with.
  image: harbor.baai.ac.cn/llm-safety-center/enviroments:agents-v1.0.0

  commands:
    - cd /workspace
    - torchrun --nproc_per_node=1 --nnodes=3 train.py
  envs:
    {
      HOME: /home/yijingwei,
      NCCL_DEBUG: INFO,
      MASTER_PORT: "29500",
    }
  resource_config:
    queue_category: dedicated
    project_set_name: baai-safety
    project_name: baai-safety_research
    region_name: 北京-大兴
    zone_name: 可用区A
    queue_name: baai-safety_research_yybu-private
    priority: high
    accelerator_model: NVIDIA_A100-SXM4-40GB
    accelerator_count: 1
    cpu_cores: 8
    mem_gib: 32
    shared_mem_gib: 16
    # Node roles: each inherits the resource fields above; a role's own
    # values override them. Without roles the job is single-node (one Master).
    roles:
      - name: Master
        replicas: 1
      - name: Worker
        replicas: 2
        accelerator_count: 2
        cpu_cores: 16
        mem_gib: 64
        shared_mem_gib: 32
